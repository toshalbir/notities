<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Notities">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2">
  <meta name="description" content="Dagelijkse agenda met tijdvakken, notities en automatische opslag naar GitHub.">
  <title>Notities</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-font="hand">
  <div class="app">
    <header class="topbar">
      <button class="nav-btn" id="prev-day" type="button" aria-label="Vorige dag">‹</button>
      <div class="date-center">
        <input type="date" id="date-picker" aria-label="Ga naar datum">
        <span id="date-short">zo 22 nov</span>
      </div>
      <button class="nav-btn" id="next-day" type="button" aria-label="Volgende dag">›</button>
      <span class="spacer"></span>
      <button class="text-btn" id="go-today" type="button">Vandaag</button>
      <button class="icon-btn" id="open-search" type="button" aria-label="Notities zoeken" title="Zoeken">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="M15.4 15.4 20 20"/></svg>
      </button>
      <button class="icon-btn" id="open-settings" type="button" aria-label="Instellingen" title="Instellingen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M4.5 7.5l2.2 1.3M17.3 15.2l2.2 1.3M4.5 16.5l2.2-1.3M17.3 8.8l2.2-1.3"/></svg>
      </button>
    </header>

    <main class="workspace">
      <article class="page" aria-label="Agendapagina voor deze dag">
        <header class="page-head">
          <span id="page-date">zondag 22 november 2026</span>
          <span class="page-num" id="page-num">326</span>
        </header>

        <div class="agenda">
          <div class="time-col" id="time-col" aria-hidden="true"></div>
          <div class="slot-col" id="slot-col"></div>
        </div>

        <section class="free-notes">
          <h2>Notities</h2>
          <div class="notes-area">
            <div class="notes-rule" aria-hidden="true"></div>
            <textarea id="notes-input" aria-label="Losse notities voor deze dag" placeholder="Losse notities voor deze dag…" spellcheck="true" autocapitalize="sentences" autocorrect="on"></textarea>
          </div>
        </section>
      </article>
    </main>

    <footer class="actionbar">
      <span class="sync" id="sync-status" role="status">Lokaal opgeslagen</span>
      <button class="mini-btn" id="download-md" type="button" title="Download als .md" aria-label="Download als .md">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11M8 10.5l4 4 4-4M4.5 17.5v2h15v-2"/></svg>
      </button>
      <button class="mini-btn accent" id="export-github" type="button" title="Nu exporteren naar GitHub" aria-label="Nu exporteren naar GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5v-11M8 13.5l4-4 4 4M4.5 6.5v-2h15v2"/></svg>
      </button>
    </footer>
  </div>

  <div class="sheet-overlay" id="search-overlay" hidden>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="search-title">
      <header class="panel-head">
        <h2 id="search-title">Zoeken</h2>
        <button class="close-btn" type="button" data-close="search-overlay" aria-label="Sluiten">✕</button>
      </header>
      <div class="search-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="M15.4 15.4 20 20"/></svg>
        <input type="search" id="search-input" placeholder="Woord, tijd of datum" autocomplete="off" enterkeyhint="search">
      </div>
      <p class="search-meta" id="search-meta"></p>
      <div class="results" id="search-results"></div>
    </section>
  </div>

  <div class="sheet-overlay" id="settings-overlay" hidden>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="panel-head">
        <h2 id="settings-title">Instellingen</h2>
        <button class="close-btn" type="button" data-close="settings-overlay" aria-label="Sluiten">✕</button>
      </header>
      <form id="settings-form" autocomplete="off">
        <div class="form-row">
          <label for="cfg-owner">Gebruikersnaam</label>
          <input id="cfg-owner" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="bijv. toshk">
        </div>
        <div class="form-row">
          <label for="cfg-repo">Repository</label>
          <input id="cfg-repo" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="bijv. notities">
        </div>
        <div class="form-row-pair">
          <div class="form-row">
            <label for="cfg-branch">Branch</label>
            <input id="cfg-branch" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" value="main">
          </div>
          <div class="form-row">
            <label for="cfg-path">Map</label>
            <input id="cfg-path" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" value="notities">
          </div>
        </div>
        <div class="form-row">
          <label for="cfg-token">Toegangstoken</label>
          <input id="cfg-token" type="password" placeholder="github_pat_…" autocapitalize="off" autocorrect="off" spellcheck="false">
        </div>
        <div class="form-row">
          <label for="cfg-font">Lettertype in agenda</label>
          <select id="cfg-font">
            <option value="hand">Handschrift (Patrick Hand)</option>
            <option value="system">Gewoon (SF / Helvetica)</option>
          </select>
        </div>
        <label class="toggle-row" for="cfg-autosave">
          <input id="cfg-autosave" type="checkbox" checked>
          <span>Automatisch opslaan naar GitHub</span>
        </label>
        <p class="hint">
          Autosave wacht ~5 seconden tot je stopt met typen en schrijft daarna
          <code>notities/agenda.md</code> bij. Token: fine-grained met alleen <strong>Contents: read and write</strong>.
          Alles blijft ook lokaal op dit apparaat.
        </p>
        <p class="connection-status" id="connection-status" role="status"></p>
        <div class="form-actions">
          <button class="secondary-btn" id="test-connection" type="button">Controleer</button>
          <button class="primary-btn" type="submit">Opslaan</button>
        </div>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
